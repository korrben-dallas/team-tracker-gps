<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#16261d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Team Tracker">
  <meta name="format-detection" content="telephone=no">
  <title>Team Tracker GPS — групповой трекер</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map"></div>

  <header id="topbar">
    <button id="btnPeople" class="chip" aria-label="Группа и участники">
      <span id="groupAvatar" class="avatar sm"></span>
      <span id="groupName">…</span>
      <span id="peopleCount" class="badge">0</span>
    </button>
    <button id="btnRating" class="chip rating-chip" aria-label="Рейтинг">🏆 <b id="myScore">0</b></button>
    <span class="spacer"></span>
    <button id="syncState" class="chip" aria-label="Синхронизация">
      <span class="dot"></span><span class="txt">…</span>
    </button>
  </header>

  <button id="btnGroup" class="group-btn" aria-label="Выбрать группу"></button>
  <div id="groupMenu" class="group-menu hidden" role="menu"></div>

  <div id="fabs">
    <button id="btnMark" class="fab mark-fab" aria-label="Поставить метку">
      <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11.3A6.5 6.5 0 0 1 18.5 9.7C18.5 14.8 12 21 12 21z" fill="none"/><path d="M12 6.5v6M9 9.5h6" fill="none"/></svg>
    </button>
    <button id="btnLocate" class="fab" aria-label="Где я">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5" fill="none"/></svg>
    </button>
    <button id="btnOffline" class="fab" aria-label="Скачать карту">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16" fill="none"/></svg>
    </button>
    <button id="btnSettings" class="fab" aria-label="Настройки">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" fill="none"/></svg>
    </button>
  </div>

  <div id="legend" aria-hidden="true">
    <div class="bar"></div>
    <div class="labels"><span>сейчас</span><span id="legendMid"></span><span id="legendEnd"></span></div>
  </div>

  <div id="recbar">
    <div id="recStats" class="hidden">
      <span id="recTime">00:00</span>
      <span id="recDist">0 м</span>
      <span id="recGps">GPS…</span>
    </div>
    <button id="btnRec" class="rec">Начать запись трека</button>
  </div>

  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="icon-btn" aria-label="Закрыть">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="onboard" class="overlay hidden">
    <div class="card">
      <img class="logo-img" src="icons/icon-192.png" alt="">
      <h1>Team Tracker GPS</h1>
      <p class="muted">Групповой GPS‑трекер: треки группы на общей карте, цвет полосы показывает, как давно здесь прошли.</p>
      <label class="photo-pick">
        <input id="obPhoto" type="file" accept="image/*" hidden>
        <span id="obPhotoPreview" class="avatar xl">+ фото</span>
      </label>
      <label class="field">Ваш ник
        <input id="obNick" maxlength="24" autocomplete="nickname" placeholder="Например, Лесник">
      </label>
      <p id="obHint" class="muted small"></p>
      <label id="obAgreeRow" class="agree"><input type="checkbox" id="obAgree">
        <span>Принимаю <a href="#" data-doc="terms.html">правила сообщества</a> и <a href="#" data-doc="privacy.html">политику конфиденциальности</a>. Оскорбительные и незаконные материалы запрещены.</span></label>
      <button id="obGo" class="primary">Далее</button>
    </div>
  </div>

  <div id="installTip" class="tip hidden">
    <b>Установите на iPhone:</b> в Safari нажмите «Поделиться» → «На экран „Домой“» и открывайте приложение с иконки — так оно работает без интернета.
    <button class="icon-btn" id="installTipClose" aria-label="Скрыть">✕</button>
  </div>

  <div id="docView" class="doc-view hidden">
    <div class="doc-head"><b id="docTitle"></b><button class="icon-btn" id="docClose" aria-label="Закрыть">✕</button></div>
    <iframe id="docFrame" title="Документ"></iframe>
  </div>

  <div id="toast" role="status"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
